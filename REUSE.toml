version = 1

# Register headers generated from the STMicroelectronics SVD files.
[[annotations]]
path = ["firmware/devices/STM32H563/*.hpp", "firmware/devices/STM32H523/*.hpp"]
SPDX-FileCopyrightText = "2025 STMicroelectronics"
SPDX-License-Identifier = "Apache-2.0"

# Register building blocks written by SvdGenerator next to the headers above.
[[annotations]]
path = ["firmware/devices/STM32H563/mmio.hpp", "firmware/devices/STM32H523/mmio.hpp"]
precedence = "override"
SPDX-FileCopyrightText = "2019-2026 Thomas Legrand"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["CMakePresets.json", ".gitignore", ".gitmodules"]
SPDX-FileCopyrightText = "2026 Thomas Legrand"
SPDX-License-Identifier = "MPL-2.0"

# Documentation.
[[annotations]]
path = ["**/README.md", "CONTRIBUTING.md", "AGENTS.md"]
SPDX-FileCopyrightText = "2026 Thomas Legrand"
SPDX-License-Identifier = "CC-BY-4.0"

# Hardware design files, generated or edited with KiCad.
[[annotations]]
path = ["hardware/**/*.kicad_*", "hardware/**/sym-lib-table", "hardware/**/fp-lib-table", "hardware/**/results.md",
        "hardware/**/*.step"]
SPDX-FileCopyrightText = "2026 Thomas Legrand"
SPDX-License-Identifier = "CERN-OHL-W-2.0"
